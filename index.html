<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css" />
    <title>foodwagon</title>
  </head>
  <body class="h-screen">
    <header class="flex justify-around pt-4 pb-4 items-center">
      <div class="flex gap-2">
        <img src="./public/Mask Group.png" alt="" />
        <p>
          <span class="text-[#f2732b] text-xl font-medium">food</span
          ><span class="text-[#e4b937] text-xl font-medium">waGon</span>
        </p>
      </div>
      <div class="flex gap-2">
        <p class="font-bold">Deliver to :</p>
        <img src="./public/map-marker-alt.png" alt="" />

        <p>
          <span class="text-[#7a7a7a]">Current Location</span
          ><span class="text-[#404040] font-bold"
            >Mohammadpur Bus Stand, Dhaka</span
          >
        </p>
      </div>
      <div class="flex gap-4 items-center justify-center">
        <button class="flex gap-3 items-center justify-center">
          <img class="w-4.5 h-4.5" src="./public/Search.png" alt="" />
          <p class="font-bold text-[#5f5f5f]">Search Food</p>
        </button>
        <button
          class="flex gap-3 w-29.5 h-11.5 items-center justify-center border border-white shadow-2xl shadow-[#FFB30E]"
        >
          <img class="w-4 h-4.5" src="./public/user.png" alt="" />
          <p class="text-[#e0a238]">Login</p>
        </button>
      </div>
    </header>
    <main>
      <section
        class="bg-[url(/public/Group11.png)] h-155 flex justify-between pl-12 items-center pr-12 relative"
      >
        <div class="flex flex-col gap-4 w-[856px] h-[356px]">
          <h1 class="text-[#fbfff8] text-8xl font-bold">Are you starving?</h1>
          <p class="text-[#544e2d] text-xl">
            Within a few clicks, find meals that are accessible near you
          </p>
          <div class="flex flex-col gap-4 bg-white p-4 rounded-xl">
            <div class="flex gap-4 bg-white p-2 rounded-xl">
              <button
                class="flex gap-2 bg-[#fef1e9] w-37 h-9.5 justify-center items-center rounded-xl"
              >
                <img class="w-5.75 h-4.5" src="./public/Icon.png" alt="" />
                <p class="text-[#f28c5f] font-bold">Delivery</p>
              </button>
              <button
                class="flex gap-2 w-34.5 h-9.5 justify-center items-center"
              >
                <img class="w-4 h-4.5" src="./public/Icon (1).png" alt="" />
                <p>Pickup</p>
              </button>
            </div>
            <hr class="text-gray-300" />
            <div class="flex justify-center items-center gap-4">
              <div
                class="flex gap-4 bg-[#f5f5f5] items-center justify-center p-4 rounded-xl h-12"
              >
                <img src="./public/Icon-2.png" alt="" />
                <input
                  class="w-136 h-4 text-[#b3b3b3] text-xl font-normal"
                  type="text"
                  placeholder="Enter Your Address"
                />
              </div>
              <div>
                <button
                  class="bg-[#f9631e] flex gap-3 w-49.75 h-15 justify-center items-center rounded-xl"
                >
                  <img src="./public/Icon--.png" alt="" />
                  <p class="text-white">Find Food</p>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div>
          <img
            class="absolute top-45 left-240"
            src="./public/Overlay (1).png"
            alt=""
          />
          <img
            class="absolute top-25 left-190 bg-none"
            src="./public/Image.png"
            alt=""
          />
        </div>
      </section>
      <section class="flex gap-2 pt-8 justify-center items-center">
        <div class="flex flex-col gap-4 items-start relative">
          <img class="rounded-xl" src="./public/Image2.png" alt="" />
          <p>Greys Vage</p>
          <button
            class="bg-[#f7e6d4] text=[#df7f43] text-start pl-2 rounded-xl w-51.25 h-10.5"
          >
            6 Days Remaining
          </button>
          <div class="flex absolute bg-[#ffb30e] w-35 h-20.75 rounded-b-lg">
            <span>15</span>
            <div class="flex flex-col">
              <p></p>
              <p></p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
